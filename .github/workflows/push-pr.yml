name: push request workflow
  on:
    push:
      branches:
        - main
        - "release/**"
        path:
          - "src/**"
    pull_request:
      branches:
        - main
        - "release/**"
  jobs:
    test-job:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4.4.0
        - name: Run tests
          run: npm test
        

   